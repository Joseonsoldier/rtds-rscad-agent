name: Public package checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      OPENAI_API_KEY: ""
      OPENAI_VECTOR_STORE_ID: ""
      RSCAD_HOME: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install reviewed package and test dependencies
        run: python -m pip install -c constraints-windows-py312.txt ".[dev]"
      - name: Unit and fake-driver tests
        run: python -m unittest discover -s tests -v
      - name: Actual STDIO handshake with inactive policy
        run: python tools/mcp_smoke.py
      - name: Offline demo
        run: rtds-agent demo
      - name: Verify release code and source inventory
        run: |
          python tools/release_manifest.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_check.py
      - name: Build distributions
        run: python -m build
      - name: Inspect distributions
        run: |
          python -m twine check dist/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseArtifacts = Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty FullName
          python tools/release_check.py --artifacts $releaseArtifacts

# No OpenAI secret, vendor document, private model or self-hosted lab runner is used.
# Real-rack qualification belongs to an operator-controlled local environment.
